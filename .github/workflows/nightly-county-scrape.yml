name: Nightly 67-County Parallel Scrape

# ZoneWise agentic pipeline — CrossBeam 3-mode research pattern
# Reads county SKILL.md → Mode1 WebSearch → Mode2 WebFetch → Mode3 AgentQL/Modal
# Runs nightly at 11 PM EST (04:00 UTC)

on:
  schedule:
    - cron: '0 4 * * *'  # 11 PM EST
  workflow_dispatch:
    inputs:
      counties:
        description: 'Counties to scrape (comma-separated slugs, or "all", or "pilots")'
        required: false
        default: 'pilots'
      mode:
        description: 'Research mode (1=webSearch, 2=webFetch, 3=agentQL, auto=all)'
        required: false
        default: 'auto'
      dry_run:
        description: 'Dry run — extract but do not write to Supabase'
        required: false
        default: 'false'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  AGENTQL_API_KEY: ${{ secrets.AGENTQL_API_KEY }}
  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

jobs:
  # ── Phase 1: Load county list from skill files ─────────────────────────────
  load-county-config:
    name: Load County Config from Skill Files
    runs-on: ubuntu-latest
    outputs:
      county_matrix: ${{ steps.build-matrix.outputs.matrix }}
      total_counties: ${{ steps.build-matrix.outputs.total }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-desktop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx pyyaml

      - name: Build county matrix from skills-manifest.yaml
        id: build-matrix
        run: |
          python3 << 'PYEOF'
          import yaml, json, os, sys

          with open('zonewise/skills/skills-manifest.yaml') as f:
              manifest = yaml.safe_load(f)

          # Get target counties from input
          target = "${{ github.event.inputs.counties || 'all' }}"

          pilot_counties = {"brevard", "miami-dade", "orange"}
          phase1_counties = {"hillsborough", "palm-beach", "pinellas"}

          county_skills = [
              s for s in manifest['skills']
              if s['name'].startswith('county-')
          ]

          if target == 'pilots':
              selected = [s for s in county_skills if s['name'].replace('county-','') in pilot_counties]
          elif target == 'phase1':
              selected = [s for s in county_skills if s['name'].replace('county-','') in pilot_counties | phase1_counties]
          elif target == 'all':
              selected = county_skills
          else:
              slugs = set(t.strip() for t in target.split(','))
              selected = [s for s in county_skills if s['name'].replace('county-','') in slugs]

          matrix = {"include": [
              {
                  "county_slug": s['name'].replace('county-',''),
                  "county_name": s['description'].split('County FL')[0].strip().split('
')[-1].strip(),
                  "co_no": s.get('co_no', 0),
                  "skill_path": s['path'],
                  "priority": s.get('priority', 3),
              }
              for s in selected
          ]}

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps(matrix)}
")
              f.write(f"total={len(selected)}
")

          print(f"✅ Matrix built: {len(selected)} counties")
          PYEOF

  # ── Phase 2: Parallel county research (3-mode) ────────────────────────────
  county-research:
    name: Research ${{ matrix.county_slug }} (co_no=${{ matrix.co_no }})
    runs-on: ubuntu-latest
    needs: load-county-config
    strategy:
      matrix: ${{ fromJson(needs.load-county-config.outputs.county_matrix) }}
      max-parallel: 10  # 10 counties at a time to respect rate limits
      fail-fast: false  # Never abort others on single failure
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise

      - uses: actions/checkout@v4
        with:
          repository: breverdbidder/zonewise-desktop
          path: zonewise-desktop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx pyyaml agentql playwright
          playwright install chromium

      - name: Authenticate Modal
        if: ${{ env.MODAL_TOKEN_ID != "" && env.MODAL_TOKEN_SECRET != "" }}
        run: |
          pip install modal
          modal token set \
            --token-id "$MODAL_TOKEN_ID" \
            --token-secret "$MODAL_TOKEN_SECRET"

      - name: Load county skill file
        id: load-skill
        run: |
          SKILL_PATH="zonewise-desktop/${{ matrix.skill_path }}"
          echo "skill_content<<EOF" >> $GITHUB_OUTPUT
          cat "$SKILL_PATH" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "✅ Loaded skill: $SKILL_PATH"

          # Extract anti_scrape flag from SKILL.md frontmatter
          ANTI=$(grep "^anti_scrape:" "$SKILL_PATH" | awk '{print $2}')
          RATE=$(grep "^rate_limit_rpm:" "$SKILL_PATH" | awk '{print $2}')
          echo "anti_scrape=$ANTI" >> $GITHUB_OUTPUT
          echo "rate_limit_rpm=$RATE" >> $GITHUB_OUTPUT

      - name: Mode 1 — WebSearch Discovery
        id: mode1
        if: ${{ github.event.inputs.mode == 'auto' || github.event.inputs.mode == '1' }}
        run: |
          python3 agents/county_research_agent.py \
            --county "${{ matrix.county_slug }}" \
            --co-no "${{ matrix.co_no }}" \
            --mode 1 \
            --output mode1_result.json
        continue-on-error: true

      - name: Mode 2 — WebFetch Extraction
        id: mode2
        if: ${{ github.event.inputs.mode == 'auto' || github.event.inputs.mode == '2' }}
        run: |
          python3 agents/county_research_agent.py \
            --county "${{ matrix.county_slug }}" \
            --co-no "${{ matrix.co_no }}" \
            --mode 2 \
            --input mode1_result.json \
            --output mode2_result.json
        continue-on-error: true

      - name: Mode 3 — AgentQL/Modal Fallback
        id: mode3
        if: |
          steps.load-skill.outputs.anti_scrape == 'true' ||
          github.event.inputs.mode == '3' ||
          (github.event.inputs.mode == 'auto' && steps.mode2.outcome == 'failure')
        run: |
          modal run src/scrapers/county_agentql_scraper.py \
            --county "${{ matrix.county_slug }}" \
            --co-no "${{ matrix.co_no }}" \
            --rate-limit "${{ steps.load-skill.outputs.rate_limit_rpm }}" \
            --output mode3_result.json
        continue-on-error: true

      - name: Merge results + upsert to Supabase
        id: upsert
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python3 scripts/upsert_county_results.py \
            --county "${{ matrix.county_slug }}" \
            --co-no "${{ matrix.co_no }}" \
            --mode1 mode1_result.json \
            --mode2 mode2_result.json \
            --mode3 mode3_result.json

      - name: Update daily_metrics
        if: always()
        run: |
          python3 << 'PYEOF'
          import httpx, json, os
          from datetime import datetime, timezone

          mode1_ok = "${{ steps.mode1.outcome }}" == "success"
          mode2_ok = "${{ steps.mode2.outcome }}" == "success"
          mode3_ok = "${{ steps.mode3.outcome }}" == "success"
          upsert_ok = "${{ steps.upsert.outcome }}" == "success"

          status = "SUCCESS" if (mode2_ok or mode3_ok) and upsert_ok else "PARTIAL" if (mode2_ok or mode3_ok) else "FAILED"

          payload = {
              "county_slug": "${{ matrix.county_slug }}",
              "co_no": ${{ matrix.co_no }},
              "date": datetime.now(timezone.utc).date().isoformat(),
              "mode1_success": mode1_ok,
              "mode2_success": mode2_ok,
              "mode3_success": mode3_ok,
              "upsert_success": upsert_ok,
              "status": status,
              "run_url": f"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          }

          headers = {
              "apikey": os.environ["SUPABASE_KEY"],
              "Authorization": f"Bearer {os.environ['SUPABASE_KEY']}",
              "Content-Type": "application/json",
              "Prefer": "resolution=merge-duplicates",
          }

          r = httpx.post(
              f"{os.environ['SUPABASE_URL']}/rest/v1/daily_metrics",
              headers=headers, json=payload, timeout=10
          )
          print(f"daily_metrics: {r.status_code} — {status}")
          PYEOF

      - name: Circuit breaker — escalate on failure
        if: failure()
        run: |
          python3 << 'PYEOF'
          import httpx, json, os
          from datetime import datetime, timezone

          # Check failure count for this county in last 3 days
          headers = {
              "apikey": os.environ["SUPABASE_KEY"],
              "Authorization": f"Bearer {os.environ['SUPABASE_KEY']}",
          }
          r = httpx.get(
              f"{os.environ['SUPABASE_URL']}/rest/v1/daily_metrics",
              headers=headers,
              params={
                  "county_slug": "eq.${{ matrix.county_slug }}",
                  "status": "eq.FAILED",
                  "select": "id,date",
                  "limit": "3",
                  "order": "date.desc",
              },
              timeout=10,
          )
          failures = r.json() if r.status_code == 200 else []
          print(f"Recent failures: {len(failures)}")

          if len(failures) >= 3:
              # Circuit breaker triggered — insert ESCALATE
              insight = {
                  "type": "ESCALATE",
                  "county_slug": "${{ matrix.county_slug }}",
                  "co_no": ${{ matrix.co_no }},
                  "message": f"3 consecutive failures for county-${{ matrix.county_slug }}. Traycer issue required.",
                  "created_at": datetime.now(timezone.utc).isoformat(),
              }
              httpx.post(
                  f"{os.environ['SUPABASE_URL']}/rest/v1/insights",
                  headers={**headers, "Content-Type": "application/json"},
                  json=insight, timeout=10,
              )
              print("⚠️ ESCALATE inserted — Traycer issue will be created")
          PYEOF

  # ── Phase 3: Summary Report ────────────────────────────────────────────────
  scrape-summary:
    name: Nightly Scrape Summary
    runs-on: ubuntu-latest
    needs: county-research
    if: always()

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Query daily_metrics + write summary
        run: |
          python3 << 'PYEOF'
          import httpx, os
          from datetime import datetime, timezone, timedelta

          today = datetime.now(timezone.utc).date().isoformat()

          headers = {
              "apikey": os.environ["SUPABASE_KEY"],
              "Authorization": f"Bearer {os.environ['SUPABASE_KEY']}",
          }
          r = httpx.get(
              f"{os.environ['SUPABASE_URL']}/rest/v1/daily_metrics",
              headers=headers,
              params={"date": f"eq.{today}", "select": "*", "limit": "100"},
              timeout=15,
          )
          rows = r.json() if r.status_code == 200 else []

          success = sum(1 for row in rows if row.get("status") == "SUCCESS")
          partial = sum(1 for row in rows if row.get("status") == "PARTIAL")
          failed = sum(1 for row in rows if row.get("status") == "FAILED")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"# 🏔️ ZoneWise Nightly Scrape — {today}

")
              f.write(f"| Metric | Value |
|--------|-------|
")
              f.write(f"| Total counties | {len(rows)} |
")
              f.write(f"| ✅ SUCCESS | {success} |
")
              f.write(f"| ⚠️ PARTIAL | {partial} |
")
              f.write(f"| ❌ FAILED | {failed} |
")
              f.write(f"| Success rate | {success/max(len(rows),1)*100:.1f}% |

")

              if failed > 0:
                  failed_list = [row["county_slug"] for row in rows if row.get("status") == "FAILED"]
                  f.write(f"### ❌ Failed Counties
")
                  for c in failed_list:
                      f.write(f"- {c}
")
                  f.write("
Check `insights` table for ESCALATE records → Traycer issues.
")

          print(f"✅ Summary: {success} success, {partial} partial, {failed} failed / {len(rows)} total")
          PYEOF
