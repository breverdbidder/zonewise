name: PRD-8 Scrape NULL Zone Standards

on:
  workflow_dispatch:

jobs:
  scrape:
    name: Playwright Scrape - 61 NULL zone_standards rows
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright httpx beautifulsoup4
          playwright install chromium --with-deps

      - name: Run PRD-8 scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: python scripts/prd8_scrape_null_standards.py

      - name: Verify results
        env:
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: python scripts/prd8_verify.py
