name: Deploy Zone Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/007_skill_file_paths.sql'
      - 'migrations/008_backfill_confidence.sql'

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    env:
      PROJ_REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: Deploy migration via Supabase Management API
        env:
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: |
          deploy_migration() {
            local file=$1
            local name=$2
            echo "Deploying $name..."
            SQL=$(cat "$file")
            RESPONSE=$(curl -s -w "\nHTTP:%{http_code}" \
              -X POST \
              "https://api.supabase.com/v1/projects/${PROJ_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_MGMT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'query': open('$file').read()}))")")
            HTTP_STATUS=$(echo "$RESPONSE" | grep "^HTTP:" | cut -d: -f2)
            BODY=$(echo "$RESPONSE" | grep -v "^HTTP:")
            echo "HTTP $HTTP_STATUS: $BODY"
            if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
              echo "FAIL: $name returned $HTTP_STATUS"
              exit 1
            fi
            echo "$name deployed!"
          }

          deploy_migration "migrations/007_skill_file_paths.sql" "007_skill_file_paths"
          deploy_migration "migrations/008_backfill_confidence.sql" "008_backfill_confidence"

      - name: Verify migration 008
        env:
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
import json, urllib.request

MGMT = "$SUPABASE_MGMT_TOKEN"
PROJ = "mocerqjnksmhcjzxrewo"

def sql(q):
    data = json.dumps({"query": q}).encode()
    req = urllib.request.Request(
        f"https://api.supabase.com/v1/projects/{PROJ}/database/query",
        data=data,
        headers={"Authorization": f"Bearer {MGMT}", "Content-Type": "application/json"},
        method="POST"
    )
    with urllib.request.urlopen(req, timeout=15) as r:
        return json.load(r)

r = sql("SELECT COUNT(*) as null_remaining FROM zone_standards WHERE confidence_score IS NULL AND front_setback_ft IS NOT NULL;")
print("NULL confidence with setback data (should be 0):", r)

r2 = sql("SELECT COUNT(*) as total, COUNT(*) FILTER (WHERE confidence_score IS NOT NULL) as scored FROM zone_standards;")
print("Total / scored:", r2)
PYEOF
