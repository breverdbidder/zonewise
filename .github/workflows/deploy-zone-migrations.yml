name: Deploy Zone Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/005_zone_standards.sql'
      - 'migrations/006_permitted_uses.sql'
      - 'migrations/007_skill_file_paths.sql'

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Deploy 005_zone_standards.sql
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Deploying 005_zone_standards.sql..."
          psql "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres" \
            -f migrations/005_zone_standards.sql
          echo "zone_standards migration complete!"

      - name: Deploy 006_permitted_uses.sql
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Deploying 006_permitted_uses.sql..."
          psql "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres" \
            -f migrations/006_permitted_uses.sql
          echo "permitted_uses migration complete!"

      - name: Deploy 007_skill_file_paths.sql
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Deploying 007_skill_file_paths.sql..."
          psql "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres" \
            -f migrations/007_skill_file_paths.sql
          echo "skill_file_paths migration complete!"

      - name: Verify Migration 007
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DB_URL="postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres"

          echo "=== co_no count ==="
          CO_COUNT=$(psql "$DB_URL" -t -c "SELECT COUNT(*) FROM public.jurisdictions WHERE co_no IS NOT NULL;")
          echo "Rows with co_no: $CO_COUNT"

          echo "=== skill_file_path count ==="
          SF_COUNT=$(psql "$DB_URL" -t -c "SELECT COUNT(*) FROM public.jurisdictions WHERE skill_file_path IS NOT NULL;")
          echo "Rows with skill_file_path: $SF_COUNT"

          echo "=== index check ==="
          psql "$DB_URL" -c "SELECT indexname FROM pg_indexes WHERE tablename='jurisdictions' AND indexname='idx_jurisdictions_co_no';"

          echo "=== spot check Broward ==="
          psql "$DB_URL" -c "SELECT county, co_no, skill_file_path FROM public.jurisdictions WHERE county ILIKE '%broward%' LIMIT 3;"

          echo "=== spot check Brevard ==="
          psql "$DB_URL" -c "SELECT county, co_no, skill_file_path FROM public.jurisdictions WHERE county ILIKE '%brevard%' LIMIT 3;"

          # Fail if co_no count is under 67
          if [ "$CO_COUNT" -lt 67 ]; then
            echo "FAIL: co_no populated for only $CO_COUNT rows (expected >= 67)"
            exit 1
          fi
          echo "PASS: Migration 007 verified successfully"
