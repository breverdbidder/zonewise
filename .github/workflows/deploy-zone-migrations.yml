name: Deploy Zone Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/007_skill_file_paths.sql'

jobs:
  deploy-007:
    runs-on: ubuntu-latest
    env:
      PROJ_REF: mocerqjnksmhcjzxrewo

    steps:
      - uses: actions/checkout@v4

      - name: Deploy 007 via Supabase Management API
        env:
          SUPABASE_MGMT_TOKEN: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: |
          echo "Reading migration SQL..."
          SQL=$(cat migrations/007_skill_file_paths.sql)

          echo "Executing via Supabase Management API..."
          RESPONSE=$(curl -s -w "\nHTTP:%{http_code}" \
            -X POST \
            "https://api.supabase.com/v1/projects/${PROJ_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_MGMT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(echo "$SQL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "^HTTP:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "^HTTP:")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "FAIL: API returned $HTTP_STATUS"
            exit 1
          fi
          echo "Migration 007 deployed successfully!"

      - name: Verify via REST API
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: https://mocerqjnksmhcjzxrewo.supabase.co
        run: |
          echo "=== Rows with co_no ==="
          COUNT=$(curl -s \
            "${SUPABASE_URL}/rest/v1/jurisdictions?co_no=not.is.null&select=id" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Prefer: count=exact" \
            -H "Range: 0-0" \
            -o /dev/null -w "%{header:content-range}")
          echo "co_no count: $COUNT"

          echo "=== Spot check Brevard ==="
          curl -s \
            "${SUPABASE_URL}/rest/v1/jurisdictions?county=ilike.*brevard*&select=county,co_no,skill_file_path&limit=3" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}"
          echo ""
          echo "Verification complete!"
