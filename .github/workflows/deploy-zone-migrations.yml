name: Deploy Zone Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/007_skill_file_paths.sql'

jobs:
  deploy-007:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Deploy 007_skill_file_paths.sql
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "Deploying 007_skill_file_paths.sql..."
          psql "postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres" \
            -f migrations/007_skill_file_paths.sql
          echo "Migration 007 complete!"

      - name: Verify Migration 007
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DB="postgresql://postgres:${PGPASSWORD}@db.mocerqjnksmhcjzxrewo.supabase.co:5432/postgres"

          echo "=== co_no count ==="
          CO=$(psql "$DB" -t -c "SELECT COUNT(*) FROM public.jurisdictions WHERE co_no IS NOT NULL;" | tr -d ' ')
          echo "Rows with co_no: $CO"

          echo "=== skill_file_path count ==="
          SF=$(psql "$DB" -t -c "SELECT COUNT(*) FROM public.jurisdictions WHERE skill_file_path IS NOT NULL;" | tr -d ' ')
          echo "Rows with skill_file_path: $SF"

          echo "=== index check ==="
          psql "$DB" -c "SELECT indexname FROM pg_indexes WHERE tablename='jurisdictions' AND indexname='idx_jurisdictions_co_no';"

          echo "=== spot check Broward ==="
          psql "$DB" -c "SELECT county, co_no, skill_file_path FROM public.jurisdictions WHERE county ILIKE '%broward%' LIMIT 3;"

          echo "=== spot check Brevard ==="
          psql "$DB" -c "SELECT county, co_no, skill_file_path FROM public.jurisdictions WHERE county ILIKE '%brevard%' LIMIT 3;"

          if [ "$CO" -lt "67" ] 2>/dev/null; then
            echo "WARN: co_no populated for $CO rows (expected >= 67) — may need county name matching review"
          else
            echo "PASS: co_no verified ($CO rows)"
          fi

          echo "Migration 007 verification complete!"
